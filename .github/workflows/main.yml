
name: Build AutoTapRestart APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AutoTapRestart-AndroidStudio.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract source
        run: |
          unzip -q AutoTapRestart-AndroidStudio.zip -d source

      - name: Build APK
        run: |
          cd source/AutoTapRestart
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoTapRestart-APK
          path: source/AutoTapRestart/app/build/outputs/apk/debug/app-debug.apk
